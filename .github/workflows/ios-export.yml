name: Build iOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare no-JIT Unity project
        shell: bash
        env:
          PORT_IOS_WORKSHOP_FIXTURES: ${{ secrets.PORT_IOS_WORKSHOP_FIXTURES }}
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/port-ios-workshop-fixtures"
          python3 - "$fixtures" <<'PY'
          import base64
          import binascii
          import io
          import os
          import sys
          import zipfile

          encoded = os.environ.get("PORT_IOS_WORKSHOP_FIXTURES", "")
          if not encoded.strip():
              sys.exit("PORT_IOS_WORKSHOP_FIXTURES is required")
          try:
              archive = base64.b64decode("".join(encoded.split()), validate=True)
              with zipfile.ZipFile(io.BytesIO(archive)) as fixtures:
                  fixtures.extractall(sys.argv[1])
          except (binascii.Error, OSError, RuntimeError, ValueError, zipfile.BadZipFile):
              sys.exit("Could not unpack PORT_IOS_WORKSHOP_FIXTURES as a base64 ZIP")
          PY
          unset PORT_IOS_WORKSHOP_FIXTURES
          shutter="$fixtures/ShutterEvents/ShutterEvents.dll"
          reputation="$fixtures/ReputationPop/ReputationPop.dll"
          purchase="$fixtures/PurchaseStayCounter/PurchaseStayCounter.dll"
          for fixture in "$shutter" "$reputation" "$purchase"; do
            if [[ ! -s "$fixture" ]]; then
              printf 'Required Workshop fixture is missing or empty: %s\n' "${fixture##*/}" >&2
              exit 1
            fi
          done
          python3 Tools/InterpreterExperiment/prepare.py build/no-jit "$shutter" \
            --reputation-dll "$reputation" --purchase-dll "$purchase"

      # GameCI v4 installs the editor through the Hub 3 headless interface.
      - name: Install compatible Unity Hub
        shell: bash
        run: |
          set -euo pipefail
          version=3.22.6
          dmg="$RUNNER_TEMP/unity-hub.dmg"
          mount="$RUNNER_TEMP/unity-hub-volume"
          curl --fail --location --retry 3 --output "$dmg" \
            "https://public-cdn.cloud.unity3d.com/hub/prod/$version/UnityHubSetup-$version-arm64.dmg"
          echo "e04d0320daf5df3d460435320222d8f4981f1388ecb0b5b22482ad98a9bbbf85  $dmg" | shasum -a 256 -c -
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Unity Hub.app" "/Applications/Unity Hub.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' '/Applications/Unity Hub.app/Contents/Info.plist')" = "$version"

      - name: Verify Workshop mod lifecycles in Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: build/no-jit/UnityProject
          unityVersion: 2021.3.45f2
          targetPlatform: iOS
          cacheUnityInstallationOnMac: true
          versioning: None
          buildMethod: PortInterpreterBuild.VerifyLifecycle

      - name: Generate HybridCLR iOS metadata
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: build/no-jit/UnityProject
          unityVersion: 2021.3.45f2
          targetPlatform: iOS
          cacheUnityInstallationOnMac: true
          versioning: None
          buildMethod: PortInterpreterBuild.Generate

      - name: Export no-JIT Unity iOS project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: build/no-jit/UnityProject
          unityVersion: 2021.3.45f2
          targetPlatform: iOS
          cacheUnityInstallationOnMac: true
          versioning: None
          buildMethod: PortInterpreterBuild.ExportForActions

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS
          if-no-files-found: error
          retention-days: 7

      - name: Compile unsigned iOS app with Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_project=build/iOS/iOS/Unity-iPhone.xcodeproj
          if [[ ! -d "$xcode_project" ]]; then
            printf 'Unity Xcode project missing at %s; found:\n' "$xcode_project" >&2
            find build/iOS -maxdepth 3 -name '*.xcodeproj' -print >&2
            exit 1
          fi
          if ! grep -Fq 'PROSTO_INTERP=1' "$xcode_project/project.pbxproj"; then
            printf 'The generated Xcode project is missing the interpreter launcher flag.\n' >&2
            exit 1
          fi
          xcodebuild \
            -project "$xcode_project" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ProbablyStolenDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-ios.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/ProbablyStolenDerivedData/Build/Products/Release-iphoneos"
          shopt -s nullglob
          apps=("$products"/*.app)
          if (( ${#apps[@]} != 1 )); then
            printf 'Expected one iOS app, found %s\n' "${#apps[@]}" >&2
            exit 1
          fi
          test -d "${apps[0]}"
          python3 - "${apps[0]}/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          for flag in ("UIFileSharingEnabled", "LSSupportsOpeningDocumentsInPlace"):
              if info.get(flag) is not True:
                  sys.exit(f"Missing file sharing setting in built app: {flag}")
          key = "UISupportedInterfaceOrientations"
          expected = {"UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"}
          for device in ("iphone", "ipad"):
              orientations = info.get(key + "~" + device, info.get(key, []))
              if set(orientations) != expected:
                  sys.exit(f"Unexpected {device} orientations in built app: {orientations}")
          PY
          mkdir -p build/unsigned/Payload
          cp -R "${apps[0]}" build/unsigned/Payload/
          (cd build/unsigned && zip -qry ../ProbablyStolen-unsigned.ipa Payload)
          test -s build/ProbablyStolen-unsigned.ipa
          unzip -tq build/ProbablyStolen-unsigned.ipa
          python3 - build/ProbablyStolen-unsigned.ipa <<'PY'
          import sys
          import zipfile

          bundle = "Payload/ProbablyStolen.app/"
          metadata = "Data/Raw/PortInterpreterMetadata/"
          prefixes = (bundle + metadata, bundle + "Frameworks/UnityFramework.framework/" + metadata)
          with zipfile.ZipFile(sys.argv[1]) as ipa:
              if not any(item.filename.startswith(prefixes) and item.filename.endswith(".bytes")
                         and item.file_size > 0 for item in ipa.infolist()):
                  sys.exit("The unsigned IPA is missing HybridCLR AOT metadata (.bytes)")
          PY

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ProbablyStolen-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build-log
          path: ${{ runner.temp }}/xcodebuild-ios.log
          if-no-files-found: ignore
          retention-days: 7
